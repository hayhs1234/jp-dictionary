name: Production CI Quality Gate

# ==============================================================================
# GITHUB ACTIONS PRODUCTION CI PIPELINE
# Thiết kế chuẩn chỉnh: "Người thật việc thật" - Kiểm tra thực tế mã nguồn
# Tuyệt đối KHÔNG sử dụng `continue-on-error: true` hoặc `|| true` lươn lẹo!
# ==============================================================================

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. DOCKERFILE LINTING (Hadolint)
  # ============================================================================
  dockerfile-lint:
    name: 🐳 Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "backend/Dockerfile"
          config: ".hadolint.yaml"
          failure-threshold: error

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "frontend/Dockerfile"
          config: ".hadolint.yaml"
          failure-threshold: error

  # ============================================================================
  # 2. FRONTEND QUALITY & TESTING (React 19 + Vite)
  # ============================================================================
  frontend-ci:
    name: 🌐 Frontend CI (Lint, Audit, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Syntax Check (Oxlint)
        run: npm run lint

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Run Frontend Automated Unit Tests
        run: npm test

      - name: Build Production Frontend Bundle
        run: npm run build

      - name: Archive Frontend Production Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ============================================================================
  # 3. BACKEND QUALITY & TESTING (Java 21 + Spring Boot 3)
  # ============================================================================
  backend-ci:
    name: ⚙️ Backend CI (Checkstyle, Test, Package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Static Code Analysis & Style Check (Checkstyle)
        run: ./mvnw checkstyle:check

      - name: Run Backend Automated Unit Tests
        run: ./mvnw test

      - name: Package Production Spring Boot Jar
        run: ./mvnw package -DskipTests

      - name: Archive Backend Production Jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ============================================================================
  # 4. SECURITY & VULNERABILITY SCAN (Trivy SAST & Dependency Scanner)
  # ============================================================================
  security-scan:
    name: 🛡️ Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Trivy Scanner
        uses: aquasecurity/setup-trivy@v0.2.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Run Trivy Repository Vulnerability Scanner
        run: |
          trivy fs \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            .

  # ============================================================================
  # 5. DOCKER BUILD & CONTAINER VERIFICATION
  # ============================================================================
  docker-build:
    name: 📦 Container Build & Image Verification
    runs-on: ubuntu-latest
    needs: [dockerfile-lint, frontend-ci, backend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: jp-dictionary-backend:${{ github.sha }}
          load: true

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: jp-dictionary-frontend:${{ github.sha }}
          load: true

      - name: Setup Trivy Scanner
        uses: aquasecurity/setup-trivy@v0.2.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Scan Backend Docker Image with Trivy
        run: |
          trivy image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            jp-dictionary-backend:${{ github.sha }}

      - name: Scan Frontend Docker Image with Trivy
        run: |
          trivy image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            jp-dictionary-frontend:${{ github.sha }}

  # ============================================================================
  # 6. QUALITY GATE SUMMARY
  # ============================================================================
  ci-status-gate:
    name: 🏁 CI Quality Gate Status
    runs-on: ubuntu-latest
    needs: [dockerfile-lint, frontend-ci, backend-ci, security-scan, docker-build]
    steps:
      - name: Quality Gate Verification Passed
        run: |
          echo "================================================================"
          echo "🎉 ALL CI QUALITY GATES PASSED SUCCESSFULLY!"
          echo "  ✔ Dockerfile linting (Hadolint): PASSED"
          echo "  ✔ Frontend Lint, Audit, Test, Build: PASSED"
          echo "  ✔ Backend Checkstyle, Unit Test, Build: PASSED"
          echo "  ✔ Trivy Security Scan: PASSED"
          echo "  ✔ Docker Container Build & Scan: PASSED"
          echo "================================================================"
