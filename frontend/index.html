<!DOCTYPE html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JP Dictionary - Từ Điển Tiếng Nhật Thông Minh</title>
    <meta name="description" content="Nền tảng tra cứu từ điển tiếng Nhật, Kanji, ngữ pháp và học từ vựng thông minh." />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Google Fonts: Inter, Plus Jakarta Sans, Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS Play CDN with plugins: forms, container-queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', 'system-ui', '-apple-system', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'sans-serif'],
              jp: ['"Noto Sans JP"', 'sans-serif'],
            },
            colors: {
              brand: {
                50: 'var(--brand-50)',
                100: 'var(--brand-100)',
                200: 'var(--brand-200)',
                300: 'var(--brand-300)',
                400: 'var(--brand-400)',
                500: 'var(--brand-500)',
                600: 'var(--brand-600)',
                700: 'var(--brand-700)',
                800: 'var(--brand-800)',
                900: 'var(--brand-900)',
                DEFAULT: 'var(--brand-500)',
              },
              surface: {
                base: 'var(--surface-base)',
                card: 'var(--surface-card)',
                elevated: 'var(--surface-elevated)',
                border: 'var(--surface-border)',
              },
              content: {
                primary: 'var(--content-primary)',
                secondary: 'var(--content-secondary)',
                muted: 'var(--content-muted)',
              },
              accent: {
                sakura: 'var(--accent-sakura)',
                gold: 'var(--accent-gold)',
                teal: 'var(--accent-teal)',
                indigo: 'var(--accent-indigo)',
              },
            },
            boxShadow: {
              glass: 'var(--shadow-glass)',
              'glow-brand': '0 0 25px -5px rgba(239, 68, 68, 0.35)',
              'glow-sakura': '0 0 25px -5px rgba(244, 63, 94, 0.4)',
            },
            backdropBlur: {
              xs: '2px',
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-8px)' },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-[var(--surface-base)] text-[var(--content-primary)] font-sans antialiased selection:bg-brand-500 selection:text-white min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
